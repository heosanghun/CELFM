# Paper F (CELFM) 실행 설정 — Principal이 확정 후 봉인.
project_root: /home/shoon/celfm_paperf
gpu_index: 5            # Principal 지정: GPU 5
seeds: [11, 22, 33]

panel:
  source: tickers_file
  tickers_file: /home/shoon/celfm_paperf/tickers_sp500.txt
  start: "1998-01-05"
  end: "2025-12-31"
  min_tickers: 100
  max_missing_frac: 0.02
  train_end: "2018-12-31"
  holdout_start: "2019-01-02"

state:
  window_days: 20
  pca_dim: 8

model:
  hidden: 256
  layers: 3
  spectral_norm: true
  lr: 0.001
  epochs: 200
  batch: 512
  relax_steps: 2000
  relax_dt: 0.01
  relax_gamma: 0.5
  attractor_merge_eps: 0.05
  string_nodes: 32
  string_iters: 500

surrogates:
  kinds: [time_shuffle, gaussian, iaaft]

crisis_windows:
  - {name: GFC_2008, start: "2008-09-01", end: "2009-03-31"}
  - {name: COVID_2020, start: "2020-02-15", end: "2020-04-30"}
  - {name: DOTCOM_2000, start: "2000-03-01", end: "2002-10-31"}
  - {name: EURO_2011, start: "2011-07-01", end: "2011-10-31"}

# 사전등록 임계값 — Principal 승인값
thresholds:
  F1_vanc_abs_max: 0.05        # (nats)
  F2_min_attractors: 2
  F2_min_assignment: 0.95
  F2_seed_consistency_eps: 0.10 # (PCA 단위)
  F3_min_holdout_assignment: 0.90
  F4_min_barrier_nats: 1.0     # (nats)
  F5_binomial_ci: 0.95
  F6_min_rank_corr: 0.80       # n=4 crisis_windows
  F7_lambda_min_positive: true
  F8_min_leadtime_days: 10.0
  F8_placebo_windows: 100
